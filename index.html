<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IT Career Atlas</title><style>*{box-sizing:border-box}:root{--b:#100d0a;--p:#18110c;--i:#f1e4d0;--m:#b8a898;--c:#b5653b;--l:#c47a45;--line:#3a291d}html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font-family:Inter,system-ui,sans-serif}#v{height:100dvh;width:100vw;overflow:hidden}#t{display:flex;width:1600vw;height:100%;transition:transform .58s cubic-bezier(.2,.8,.2,1)}.pg{width:100vw;flex:0 0 100vw;height:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;scrollbar-width:none}.pg::-webkit-scrollbar{display:none}.home{display:grid;place-items:center;text-align:center;padding:25px;background:radial-gradient(circle at 70% 25%,#7b422b55,transparent 36%),radial-gradient(circle at 20% 80%,#a85f3840,transparent 35%),var(--b)}.hero{width:min(900px,88%)}.ey{font-size:12px;letter-spacing:.25em;color:#d2b697;font-weight:700}h1{font-size:clamp(58px,12vw,130px);line-height:.86;letter-spacing:-.07em;margin:25px 0;background:linear-gradient(110deg,#f5eadb,#c47a45);-webkit-background-clip:text;color:transparent}p{color:var(--m);line-height:1.6}.hero p{font-size:clamp(17px,2.4vw,24px);max-width:760px;margin:28px auto}.hint{margin-top:55px;letter-spacing:.14em;font-size:12px;color:#decab5}.content{width:min(1100px,88%);margin:auto;padding-bottom:150px}.rh{min-height:78dvh;display:flex;flex-direction:column;justify-content:flex-end;padding:70px 0 12vh;background:radial-gradient(circle at 80% 30%,#a85f3822,transparent 34%)}.num{color:#aa8c74;letter-spacing:.14em;font-size:13px;font-weight:700}h2{font-size:clamp(52px,8vw,105px);line-height:.9;letter-spacing:-.06em;margin:16px 0 25px}h3{font-size:clamp(28px,4vw,48px);line-height:1;margin:0 0 22px}.lead{font-size:clamp(19px,2.5vw,28px);max-width:900px}.sec{padding:75px 0;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.card,.branch,.step,.level,.check div{border:1px solid var(--line);background:linear-gradient(145deg,#b5653b18,#fff1  );border-radius:16px;padding:20px}.tree{display:grid;gap:10px}.branch{border-left:3px solid var(--c)}.branch span,.note{display:block;color:#a99787;margin-top:7px;line-height:1.5}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.step{background:var(--p)}.arr{color:var(--l);font-size:20px}.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mode>div{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--p);color:#c7b8a7;line-height:1.55}.mode b,.level b{display:block;color:var(--l);margin-bottom:8px}.road{padding:18px;border:1px solid var(--line);border-radius:15px;background:#15100c;color:#cdbdad}.road b{color:var(--l)}.check{display:grid;gap:9px}.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.dots{position:fixed;right:13px;top:50%;transform:translateY(-50%);z-index:9;display:flex;flex-direction:column;gap:7px;max-height:75vh;overflow:hidden}.dot{width:7px;height:7px;border:0;border-radius:50%;background:#6d5a4c;padding:0}.dot.on{background:#f5eadb;transform:scale(1.45)}@media(max-width:650px){.content{width:86%}.sec{padding:58px 0}.mode{grid-template-columns:1fr}h2{font-size:52px}}
</style></head><body><div id="v"><div id="t"></div></div><nav class="dots" id="d"></nav><script>
const D=[
['01','Design','UI/UX, Product, Graphic, Motion and Research',['UI/UX Designer','Product Designer','Graphic Designer','UX Researcher','Motion Designer','Interaction Designer'],['Visual hierarchy','Typography','Colour theory','UX research','Wireframing','Prototyping','Design systems','Communication'],['Figma','Adobe Creative Cloud','Framer','Miro','Notion'],['Research','Define','Ideate','Prototype','Test','Refine']],
['02','Software Development','Frontend, Backend, Full Stack, Mobile, Desktop and Game Development',['Frontend Developer','Backend Developer','Full Stack Developer','Mobile Developer','Software Developer','Desktop Developer','Game Developer'],['Programming','Algorithms','Data structures','Git','Debugging','Testing','APIs','Problem solving'],['HTML','CSS','JavaScript','TypeScript','Python','Java','React','Node.js'],['Understand','Design','Code','Test','Debug','Deploy','Maintain']],
['03','Data','Data analysis, science, engineering and business intelligence',['Data Analyst','Data Scientist','Data Engineer','BI Analyst','Analytics Engineer'],['Statistics','SQL','Data analysis','Data modelling','Visualization','Communication','Experimentation'],['SQL','Python','Pandas','Power BI','Tableau','Spark','Jupyter'],['Collect','Clean','Transform','Analyze','Visualize','Communicate']],
['04','AI & Machine Learning','AI engineering, machine learning, generative AI, NLP and computer vision',['AI Engineer','ML Engineer','Generative AI Engineer','NLP Engineer','Computer Vision Engineer','MLOps Engineer'],['Python','Statistics','Linear algebra','Machine learning','Evaluation','Data preparation','Model reasoning'],['Python','PyTorch','TensorFlow','Transformers','Vector databases','Model APIs','Jupyter'],['Data','Train','Evaluate','Improve','Deploy','Monitor']],
['05','Cloud & Infrastructure','Cloud platforms, infrastructure engineering and cloud architecture',['Cloud Engineer','Cloud Architect','Infrastructure Engineer','Platform Engineer','Cloud Administrator'],['Networking','Linux','Cloud concepts','Security','Automation','Reliability','Cost awareness'],['AWS','Azure','Google Cloud','Terraform','Linux','Kubernetes'],['Plan','Provision','Configure','Secure','Observe','Scale']],
['06','DevOps & SRE','Automation, delivery pipelines, reliability and platform engineering',['DevOps Engineer','Site Reliability Engineer','Platform Engineer','Release Engineer'],['Linux','Automation','CI/CD','Observability','Incident response','Infrastructure as code','Reliability'],['GitHub Actions','GitLab CI','Docker','Kubernetes','Terraform','Prometheus','Grafana'],['Build','Test','Release','Observe','Respond','Improve']],
['07','Cybersecurity','Security operations, application security, cloud security and governance',['Security Analyst','SOC Analyst','Application Security Engineer','Cloud Security Engineer','Security Engineer','GRC Analyst'],['Threat awareness','Networking','Identity','Risk','Incident response','Secure development','Security analysis'],['SIEM','EDR','IAM','Burp Suite','Nmap','Security frameworks'],['Identify','Protect','Detect','Respond','Recover','Improve']],
['08','Quality Engineering & Testing','Manual testing, automation, performance and quality engineering',['QA Engineer','Test Automation Engineer','Performance Tester','Quality Engineer','Test Analyst'],['Test design','Requirements analysis','Automation','Bug reporting','API testing','Performance testing','Quality thinking'],['Selenium','Playwright','Cypress','Postman','JMeter','Test management tools'],['Plan','Design tests','Execute','Report','Verify','Release']],
['09','Database','Database administration, engineering, development and architecture',['Database Administrator','Database Engineer','Data Architect','Database Developer'],['SQL','Data modelling','Indexing','Backup','Performance','Security','Recovery'],['PostgreSQL','MySQL','SQL Server','Oracle','MongoDB','Redis'],['Model','Store','Query','Optimize','Backup','Recover']],
['10','Networking','Network engineering, administration, operations and architecture',['Network Engineer','Network Administrator','Network Architect','Network Operations Engineer'],['TCP/IP','Routing','Switching','DNS','Troubleshooting','Network security','Monitoring'],['Cisco','Wireshark','Linux','Firewalls','Cloud networking','Network monitoring'],['Design','Configure','Connect','Monitor','Troubleshoot','Secure']],
['11','IT Support & Systems','User support, systems administration and workplace technology',['IT Support Specialist','Help Desk Technician','Systems Administrator','Desktop Support Engineer','IT Operations Technician'],['Troubleshooting','Operating systems','Hardware','Networking','User support','Documentation','Ticket management'],['Windows','Linux','Microsoft 365','Active Directory','Ticketing systems','Remote support'],['Receive','Diagnose','Resolve','Document','Escalate','Prevent']],
['12','Business & Systems Analysis','Requirements, process analysis and technology-business alignment',['Business Analyst','Systems Analyst','IT Analyst','Process Analyst','Requirements Analyst'],['Requirements','Process mapping','Stakeholder communication','Documentation','Analysis','Problem solving'],['Jira','Confluence','Miro','SQL','Excel','Process modelling tools'],['Discover','Analyze','Specify','Validate','Deliver','Measure']],
['13','Product & Project Management','Product strategy, project delivery, Agile and technology coordination',['Product Manager','Project Manager','Program Manager','Scrum Master','Product Owner'],['Prioritization','Planning','Communication','Risk management','Metrics','Leadership','Stakeholder management'],['Jira','Confluence','Azure DevOps','Notion','Product analytics tools'],['Discover','Plan','Prioritize','Build','Measure','Improve']],
['14','Architecture','Software, solution, cloud and enterprise architecture',['Software Architect','Solutions Architect','Enterprise Architect','Cloud Architect','Technical Architect'],['System design','Trade-offs','Scalability','Security','Integration','Communication','Technical leadership'],['Architecture diagrams','Cloud platforms','APIs','Containers','Databases','Observability'],['Understand','Design','Evaluate','Decide','Guide','Evolve']],
['15','Embedded · IoT · Robotics','Hardware-software systems, connected devices and robotics',['Embedded Developer','Firmware Engineer','IoT Engineer','Robotics Engineer','Controls Engineer'],['C/C++','Electronics basics','Microcontrollers','Protocols','Real-time systems','Debugging','Control systems'],['C','C++','MicroPython','Arduino','STM32','ROS','PlatformIO'],['Sense','Control','Process','Communicate','Test','Deploy']]
];
const T=document.getElementById('t'),dots=document.getElementById('d');
const card=a=>a.map(x=>`<div class="card"><b>${x}</b></div>`).join('');
const tree=(a,t)=>a.map((x,i)=>`<div class="branch"><b>${x}</b><span>${t} specialization. Responsibilities vary by employer and seniority.</span></div>`).join('');
const flow=a=>a.map((x,i)=>`<span class="step">${x}</span>${i<a.length-1?'<span class="arr">→</span>':''}`).join('');
const road=['Foundations','Core concepts','Tools & technology','Guided practice','Real projects','Portfolio / evidence','Interview readiness'];
const prog=['Foundation / Junior','Intermediate','Senior','Lead / Specialist','Architecture or Management'];
const checks=['Understand the fundamentals','Build practical projects','Use relevant tools confidently','Explain decisions and trade-offs','Create evidence through projects, portfolio or case studies','Practice role-specific interviews','Keep skills current as tools and practices change'];
function page(x){let[n,t,s,r,sk,to,st]=x;return `<section class="pg"><main class="content"><section class="rh"><span class="num">${n} · CAREER DOMAIN</span><h2>${t}</h2><p class="lead">${s}</p></section><section class="sec"><span class="num">${n}.1</span><h3>What is ${t}?</h3><p class="lead">A career domain containing related technology work. Roles inside it can differ in responsibilities, required skills, tools and seniority.</p><span class="note">This is an orientation map, not a claim that every employer uses identical titles or requirements.</span></section><section class="sec"><span class="num">${n}.2</span><h3>Career Tree</h3><div class="tree">${tree(r,t)}</div></section><section class="sec"><span class="num">${n}.3</span><h3>Core Skills</h3><div class="grid">${card(sk)}</div></section><section class="sec"><span class="num">${n}.4</span><h3>Technology & Tools</h3><div class="grid">${card(to)}</div><span class="note">Representative examples, not a universal required stack.</span></section><section class="sec"><span class="num">${n}.5</span><h3>Typical Work Process</h3><div class="flow">${flow(st)}</div></section><section class="sec"><span class="num">${n}.6</span><h3>AI · Manual · Hybrid</h3><div class="mode"><div><b>AI-assisted</b>AI may accelerate research, drafting, analysis, coding or repetitive work.</div><div><b>Human-led</b>Context, judgment, accountability, validation and decisions remain central.</div><div><b>Hybrid</b>A professional uses AI as a tool and reviews, tests and validates its output.</div></div></section><section class="sec"><span class="num">${n}.7</span><h3>Learning Roadmap</h3><div class="grid">${road.map((x,i)=>`<div class="road"><b>${String(i+1).padStart(2,'0')}</b><br>${x}</div>`).join('')}</div></section><section class="sec"><span class="num">${n}.8</span><h3>Role Progression</h3><div class="progress">${prog.map((x,i)=>`<div class="level"><b>${i+1}</b>${x}</div>`).join('')}</div><span class="note">Career progression is not universal; titles and paths differ across organizations.</span></section><section class="sec"><span class="num">${n}.9</span><h3>Job-Readiness Checklist</h3><div class="check">${checks.map(x=>`<div>✓ &nbsp;${x}</div>`).join('')}</div></section><section class="sec"><p class="note">For career exploration only. Technology requirements change; check current individual job descriptions before making education or career decisions.</p></section></main></section>`}
T.innerHTML=`<section class="pg home"><div class="hero"><span class="ey">00 · EXPLORE</span><h1>IT Career<br>Atlas</h1><p>A structured visual guide to technology career domains, roles, skills, technologies, workflows, AI involvement, learning paths and job readiness.</p><div class="hint">SWIPE TO EXPLORE →</div></div></section>`+D.map(page).join('');let P=[...T.children],cur=0,sx=0,sy=0,st=0;dots.innerHTML=P.map((_,i)=>`<button class="dot ${i?'':'on'}"></button>`).join('');function go(i){cur=Math.max(0,Math.min(P.length-1,i));T.style.transform=`translate3d(${-cur*100}vw,0,0)`;dots.querySelectorAll('.dot').forEach((x,n)=>x.classList.toggle('on',n===cur))}dots.querySelectorAll('.dot').forEach((x,i)=>x.onclick=()=>go(i));T.addEventListener('touchstart',e=>{let t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});T.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.15&&Date.now()-st<1000)go(cur+(dx<0?1:-1))},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
</script></body></html>
